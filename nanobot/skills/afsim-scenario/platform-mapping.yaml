# platform-mapping.yaml — COA platform_code → AFSIM 参数映射
#
# 用途: Agent 在 Step 2 中按 entity 的 platform_code 查表，
#       获取 AFSIM platform_type 所需的全部参数。
#
# 字段说明:
#   icon         — AFSIM 图标名称（Warlock 中显示）
#   mover        — AFSIM mover 基类型
#   category     — 功能分类（决定传感器/武器/处理器组合）
#   side_default — 默认阵营（可被 COA entity 的 side 字段覆盖）
#   speed        — 默认巡航速度
#   altitude     — 默认巡航高度
#   radar_signature — 雷达反射截面（如需要）
#   default_sensors — 默认传感器列表（按 category 选取）
#   default_weapons — 默认武器列表（可被 COA entity 的 weapons 字段覆盖）
#   default_processors — 默认处理器列表
#   notes        — 备注
#
# 扩展: 新增平台只需追加条目，Agent 自动加载。

# ═══════════════════════════════════════════
# 蓝方 (BLUE) — 空中平台
# ═══════════════════════════════════════════

KJ-500:
  icon: E-3_AWACS
  mover: WSF_AIR_MOVER
  category: awacs
  side_default: blue
  speed: 450 kts
  altitude: 35000 ft msl
  radar_signature: null  # 预警机通常不定义自身 RCS
  default_sensors:
    - name: awacs_radar
      type: WSF_GEOMETRIC_SENSOR
      params:
        frame_time: "10 sec"
        maximum_range: "500 km"
        reports_location: true
        ignore_same_side: true
    - name: link16_comm
      type: WSF_COMM_TRANSCEIVER
      params:
        frequency: "1030 MHz"
        maximum_range: "600 km"
  default_processors:
    - name: track_fusion
      type: WSF_TRACK_PROCESSOR
  notes: "空警-500 预警指挥机，核心指控节点"

J-16D:
  icon: Su-30
  mover: WSF_AIR_MOVER
  category: ew
  side_default: blue
  speed: 550 kts
  altitude: 30000 ft msl
  radar_signature:
    type: WSF_RADAR_SIGNATURE
    constant: "5 m^2"
  default_sensors:
    - name: esm_sensor
      type: WSF_ESM_SENSOR
      params:
        frame_time: "1 sec"
        receive_only: true
        reports_bearing: true
        reports_location: true
    - name: ew_jammer
      type: WSF_GEOMETRIC_SENSOR
      params:
        transmit_only: true
        maximum_range: "400 km"
  default_weapons:
    - name: pl_15
      type: bvraam
      quantity: 2
  notes: "歼-16D 电子战机，频率隔离干扰主力"

J-20:
  icon: F-22
  mover: WSF_AIR_MOVER
  category: fighter
  side_default: blue
  speed: 600 kts
  altitude: 40000 ft msl
  radar_signature:
    type: WSF_RADAR_SIGNATURE
    constant: "0.01 m^2"  # 隐身构型
  default_sensors:
    - name: fighter_radar
      type: WSF_GEOMETRIC_SENSOR
      params:
        frame_time: "2 sec"
        maximum_range: "200 km"
        reports_location: true
        ignore_same_side: true
  default_weapons:
    - name: pl_15
      type: bvraam
      quantity: 6
    - name: pl_10
